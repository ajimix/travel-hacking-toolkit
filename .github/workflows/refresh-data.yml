name: refresh-data

# Weekly auto-refresh of the scriptable data files. This is what makes the
# "refreshed weekly" claim in the transfer-bonuses skill true. Only the files
# with refresh scripts are updated here (transfer bonuses + FHR/THC/Chase-Edit
# hotel properties); the hand-curated reference files are not touched.
#
# Both refresh scripts are fail-closed (they write nothing if the scrape fails
# or returns too little), so a bad run leaves the committed data untouched.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh transfer bonuses (scrapes Frequent Miler)
        run: python3 scripts/refresh-transfer-bonuses.py || echo "transfer-bonuses refresh failed — leaving existing data (non-fatal)"

      - name: Refresh hotel property data (FHR / THC / Chase Edit KML)
        run: python3 scripts/refresh-hotel-data.py || echo "hotel-data refresh failed — leaving existing data (non-fatal)"

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain -- data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "data: weekly auto-refresh (transfer bonuses + hotel properties)"
            git push
          else
            echo "No data changes this run."
          fi
